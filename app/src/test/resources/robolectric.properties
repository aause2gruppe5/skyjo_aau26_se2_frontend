# Robolectric Configuration
# See: https://robolectric.org/configuration/

# Target Android SDK version
sdk=34

# CRITICAL: Enable bytecode instrumentation for correct interop with JaCoCo
# When set to true (default), Robolectric will instrument app classes for Android APIs
# When using JaCoCo agent at runtime, this allows both Robolectric and JaCoCo
# instrumentation to coexist properly in the class loading pipeline
enableInstrumentation=true

# Exclude Android framework classes from instrumentation to improve test speed
# These classes are already provided by Robolectric shadows
instrumentedPackages=at.aau.se2.skyjo
