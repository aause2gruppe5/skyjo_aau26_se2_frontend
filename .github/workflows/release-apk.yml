name: Release APK

# Builds the signed release APK (points at the university server
# se2-demo.aau.at:53209 via the release buildConfig) and publishes it to the
# "latest" GitHub Release so every team member can download & install it from:
#   https://github.com/aause2gruppe5/skyjo_aau26_se2_frontend/releases/latest

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write  # required to create/update the GitHub Release

concurrency:
  group: release-apk
  cancel-in-progress: true

jobs:
  release-apk:
    name: Build & publish release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK (uni server)
        run: ./gradlew :app:assembleRelease

      - name: Generate signing keystore
        # No repo secrets needed. A fresh keystore is created per run, so the
        # APK signature changes between builds — uninstall the old app before
        # installing a newer APK. (Swap this for a fixed keystore via secrets
        # if you want update-installable, stable signatures.)
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/release.jks" \
            -storepass skyjoteam -keypass skyjoteam \
            -alias skyjo -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Skyjo Team, OU=AAU SE2, O=AAU, L=Klagenfurt, C=AT"

      - name: Sign & align APK
        run: |
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)"
          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          "$BUILD_TOOLS/zipalign" -p -f 4 "$UNSIGNED" app-release-aligned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-pass pass:skyjoteam \
            --key-pass pass:skyjoteam \
            --out skyjo-release.apk \
            app-release-aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose skyjo-release.apk

      - name: Publish to the "latest" GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Skyjo – latest APK
          make_latest: true
          body: |
            Automatically built release APK for the Skyjo frontend.

            - Points at the university server `se2-demo.aau.at:53209`.
            - Built from commit ${{ github.sha }}.

            **Install:** download `skyjo-release.apk` below and open it on your
            Android device (allow "install from unknown sources"). If an older
            build is installed, uninstall it first (the signature changes per build).
          files: skyjo-release.apk
