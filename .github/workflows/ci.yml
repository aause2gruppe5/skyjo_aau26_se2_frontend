name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Test & SonarCloud
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for SonarCloud blame information

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Verify coverage data file
        run: |
          EC_FILE="app/build/outputs/unit_test_code_coverage/debugUnitTest/testDebugUnitTest.exec"
          if [ -f "$EC_FILE" ]; then
            echo "Coverage file found: $EC_FILE ($(wc -c < "$EC_FILE") bytes)"
          else
            echo "ERROR: coverage file not found at $EC_FILE"
            find app/build -name "*.ec" -o -name "*.exec" 2>/dev/null || echo "No coverage files anywhere"
            exit 1
          fi

      - name: Generate JaCoCo Report
        run: ./gradlew jacocoTestReport

      - name: Verify JaCoCo XML generated
        run: find app/build/reports/jacoco -type f 2>/dev/null || echo "No JaCoCo reports found"

      - name: SonarCloud Scan
        run: ./gradlew sonar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
