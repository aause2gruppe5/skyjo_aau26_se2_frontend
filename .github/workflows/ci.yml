name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Test & SonarCloud
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for SonarCloud blame information

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Clear JaCoCo agent cache
        run: rm -rf ~/.gradle/caches/modules-2/files-2.1/org.jacoco

      - name: Run Unit Tests with Coverage
        run: ./gradlew createDebugUnitTestCoverageReport

      - name: Run Lint
        run: ./gradlew lintDebug

      - name: Verify coverage XML
        run: |
          REPORT="app/build/reports/coverage/test/debug/report.xml"
          if [ -f "$REPORT" ]; then
            echo "Coverage report found: $REPORT"
          else
            echo "ERROR: coverage report not found at $REPORT"
            find app/build/reports -name "*.xml" 2>/dev/null || echo "No XML reports found"
            exit 1
          fi

      - name: SonarCloud Scan
        run: ./gradlew sonar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
