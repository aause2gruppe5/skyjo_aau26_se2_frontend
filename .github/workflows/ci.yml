name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Test & SonarCloud
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for SonarCloud blame information

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: List generated exec files
        run: find app/build -name "*.exec" -o -name "*.ec" 2>/dev/null || echo "No exec files found"

      - name: List kotlin class files
        run: find app/build/tmp/kotlin-classes/debug -name "*.class" 2>/dev/null | head -5 || echo "No class files found at expected path"

      - name: Generate JaCoCo Report
        run: ./gradlew jacocoTestReport

      - name: SonarCloud Scan
        run: ./gradlew sonar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
